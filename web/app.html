<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>NDA Drive Web</title>
<style>
:root{--bg:#09090b;--card:#141417;--line:#2a2a2f;--fg:#f2efe8;--mut:#8e8e93;--amb:#d4b26a;--red:#e5484d;--grn:#3dd68c;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:1100px;margin:0 auto;padding:12px 16px}
h1{font-size:28px;font-weight:800;margin:6px 0 12px;letter-spacing:-.5px}
h2{font-size:12px;letter-spacing:1.6px;color:var(--mut);font-weight:600;margin:18px 4px 8px;text-transform:uppercase}
.card{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px 16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1}.row .v{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.mut{color:var(--mut)}.amb{color:var(--amb)}.ok{color:var(--grn)}.bad{color:var(--red)}
.chips{display:flex;gap:8px}.chip{flex:1;text-align:center;font-size:12px;padding:5px 4px;border-radius:13px;border:.5px solid var(--line);color:var(--mut);white-space:nowrap;overflow:hidden}
.chip.on{color:var(--grn);border-color:rgba(61,214,140,.4);background:rgba(61,214,140,.08)}
canvas{display:block;width:100%}
#drive{display:grid;gap:14px}
@media(min-width:900px){#drive{grid-template-columns:1.6fr 1fr;align-items:center}#drive .side{grid-column:2;grid-row:1/4}}
.startwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.start{width:176px;height:176px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;
 background:radial-gradient(circle at 50% 50%,#000 0 60%,transparent 61%),linear-gradient(#6b6b73,#1e1e22);box-shadow:0 8px 30px rgba(0,0,0,.6);transition:transform .12s}
.start:active{transform:scale(.95)}
.start .face{position:absolute;inset:10px;border-radius:50%;border:3px solid rgba(200,200,200,.5);
 background:radial-gradient(circle at 35% 30%,#2a2a2e,#070708 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--fg);transition:all .3s}
.start.on .face{border-color:var(--amb);box-shadow:0 0 18px rgba(212,178,106,.7),inset 0 0 12px rgba(212,178,106,.25);color:var(--amb)}
.start small{font-size:11px;letter-spacing:2px;opacity:.8}.start b{font-size:20px;font-weight:900;letter-spacing:1.5px;line-height:1.15}
.start i{width:7px;height:7px;border-radius:4px;background:var(--red);box-shadow:0 0 6px var(--red);margin-top:8px}
.start.on i{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.big{width:100%;height:60px;border-radius:16px;border:0;font-size:18px;font-weight:800;cursor:pointer;background:var(--amb);color:var(--bg)}
.big.stop{background:rgba(229,72,77,.12);color:var(--red);border:1px solid var(--red)}
.btn{width:100%;height:48px;border-radius:14px;border:1px solid var(--amb);background:none;color:var(--amb);font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.menu .row{cursor:pointer}.menu .row .ic{width:28px;text-align:center;color:var(--amb);font-size:18px}
.menu .row .sub{display:block;color:var(--mut);font-size:13px}
.menu .row::after{content:"›";color:var(--mut);font-size:20px}
.back{background:none;border:0;color:var(--amb);font-size:16px;padding:6px 0;cursor:pointer}
.opt{cursor:pointer}.opt.sel{background:rgba(212,178,106,.10)}.opt.sel .t b{color:var(--amb)}
.opt .t small{display:block;color:var(--mut);font-size:13px}
input[type=range]{width:100%;accent-color:var(--amb)}
input[type=text]{width:100%;background:var(--bg);border:.5px solid var(--line);color:var(--fg);border-radius:10px;padding:10px;font-size:15px}
.sw{appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw:checked{background:var(--amb)}.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;transition:.2s}.sw:checked::after{left:22px}
.foot{color:var(--mut);font-size:13px;margin:8px 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:22px;line-height:1.1}
nav button.act{color:var(--amb)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-line}
.ring{display:flex;gap:16px;align-items:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:var(--fg);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<main>
<section id="tab0">
  <h1>Nổ máy</h1>
  <div id="drive">
    <div class="chips"><div class="chip" id="cGps">GPS</div><div class="chip" id="cSen">Cảm biến</div><div class="chip" id="cAud">Âm thanh</div></div>
    <canvas id="compass" height="36"></canvas>
    <canvas id="cluster"></canvas>
    <div class="side">
      <div class="startwrap">
        <button class="start" id="startBtn" aria-label="Engine start stop"><div class="face"><small>ENGINE</small><b>START</b><b>STOP</b><i></i></div></button>
        <div class="mut" id="modeLbl" style="text-align:center;font-size:13px"></div>
      </div>
      <div class="card" style="margin-top:12px"><div class="mut" style="font-size:11px;letter-spacing:1.6px">XE · TIẾNG PÔ</div><div id="carName" style="font-size:22px;font-weight:300"></div><div id="carSub" class="mut" style="font-size:13px"></div></div>
    </div>
  </div>
</section>

<section id="tab1" hidden>
  <h1>Theo dõi im lặng</h1>
  <button class="big" id="trackBtn"></button>
  <p class="mut" id="trackLbl" style="text-align:center;margin:8px 0"></p>
  <h2>Giả lập động cơ (không phát tiếng)</h2>
  <canvas id="cluster2"></canvas>
  <h2>Thu thập dữ liệu (7 ngày)</h2>
  <div class="card ring"><canvas id="ring" width="84" height="84" style="width:84px;flex:none"></canvas><div class="mono" id="trialLbl"></div></div>
  <h2>Chuyến đang ghi</h2>
  <div class="card mono" id="liveLbl"></div>
  <button class="btn" id="exportBtn">Xuất báo cáo cho Claude</button>
  <h2>Đánh giá hệ thống</h2>
  <div class="card" id="assess"></div>
</section>

<section id="tab2" hidden>
  <div id="setRoot"></div>
</section>
</main>
<nav>
  <button data-t="0" class="act"><span>⏻</span>Nổ máy</button>
  <button data-t="1"><span>◉</span>Theo dõi</button>
  <button data-t="2"><span>⚙︎</span>Cài đặt</button>
</nav>
<div id="toast"></div>
<script>
"use strict";
const WASM_B64="__WASM_B64__";
const APP_VER="1.8.3-web";
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2600)};

// ---------------- Luu tru ----------------
const DEF={preset:"amg",vol:.7,tone:.5,pops:1,shiftPop:1,autoVol:1,rearFx:1,rearAmt:.7,sub:.6,growl:.6,crisp:.6,interior:.4,mech:.3,
  learn:1,autoProfile:1,vehicle:"vf7-plus",tester:"",autoStart:0,hp:349,kg:2205,t100:5.8,applied:{},days:[],km:0,min:0,trips:0,counters:{}};
let P;try{P=Object.assign({},DEF,JSON.parse(localStorage.getItem('nda.web.v1')||'{}'))}catch(e){P=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem('nda.web.v1',JSON.stringify(P))}catch(e){}};
const bump=k=>{P.counters[k]=(P.counters[k]||0)+1;save()};

// ---------------- Danh sach xe (cap nhat tu profiles.json) ----------------
let VEH=[["vf3","VF 3","Tiêu chuẩn (1 mô-tơ, RWD)",43,32,110,"RWD",1190,14,1,"i4t"],["vf5","VF 5","Plus (1 mô-tơ, FWD)",134,100,135,"FWD",1360,10.9,1,"i4t"],
 ["vfe34","VF e34","Tiêu chuẩn (1 mô-tơ, FWD)",147,110,242,"FWD",1490,9,1,"i5"],["vf6-eco","VF 6","Eco (1 mô-tơ, FWD)",174,130,250,"FWD",1960,9.5,1,"i5"],
 ["vf6-plus","VF 6","Plus (1 mô-tơ, FWD)",201,150,310,"FWD",2020,8.9,1,"i6"],["vf7-eco","VF 7","Eco (1 mô-tơ, FWD)",201,150,310,"FWD",2085,9.5,0,"i6"],
 ["vf7-plus","VF 7","Plus (2 mô-tơ, AWD)",349,260,500,"AWD",2205,5.8,0,"amg"],["vf8-eco","VF 8","Eco (2 mô-tơ, AWD)",349,260,500,"AWD",2460,5.9,1,"amg"],
 ["vf8-plus","VF 8","Plus (2 mô-tơ, AWD)",402,300,620,"AWD",2600,5.5,0,"v8"],["vf9-eco","VF 9","Eco (2 mô-tơ, AWD)",402,300,620,"AWD",2830,6.5,0,"v8"],
 ["vf9-plus","VF 9","Plus (2 mô-tơ, AWD)",402,300,620,"AWD",2900,6.5,1,"v12"]].map(a=>({id:a[0],model:a[1],trim:a[2],hp:a[3],kw:a[4],nm:a[5],drive:a[6],kg:a[7],t100:a[8],est:!!a[9],preset:a[10]}));
let PROF=null,profErr=null;
try{PROF=JSON.parse(localStorage.getItem('nda.web.prof')||'null')}catch(e){}
const vTitle=v=>v.model+" "+v.trim.split(" (")[0];
const veh=()=>VEH.find(v=>v.id===P.vehicle);
function mergeProf(){if(PROF&&Array.isArray(PROF.vehicles))for(const d of PROF.vehicles){let v=VEH.find(x=>x.id===d.id);if(!v){v={id:d.id,model:d.model||d.id,trim:d.trim||"",preset:"amg"};VEH.push(v)}Object.assign(v,{model:d.model??v.model,trim:d.trim??v.trim,hp:d.hp??v.hp,kw:d.kw??v.kw,nm:d.nm??v.nm,kg:d.kg??v.kg,t100:d.t100??v.t100,drive:d.drive??v.drive,est:d.est??v.est,preset:d.preset??v.preset})}}
mergeProf();
async function fetchProfiles(){
  for(const u of ['profiles.json','https://raw.githubusercontent.com/anhnhadat999/nda-drive/gh-pages/profiles.json']){
    try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)continue;PROF=await r.json();localStorage.setItem('nda.web.prof',JSON.stringify(PROF));mergeProf();profErr=null;bump('profiles_ok');
      if(P.autoProfile)applyProfile(false);render();return}catch(e){profErr=String(e)}}
  bump('profiles_fail');
}
const tuning=id=>PROF&&PROF.tuning?(PROF.tuning[id]||PROF.tuning.default):null;
function applyProfile(force){const t=tuning(P.vehicle);if(!t)return false;const rev=t.rev|0;if(!force&&rev<=(P.applied[P.vehicle]|0))return false;
  const n=(k,d)=>typeof t[k]==='number'?Math.min(1,Math.max(0,t[k])):d;
  P.growl=n('growl',P.growl);P.crisp=n('crisp',P.crisp);P.interior=n('interior',P.interior);P.mech=n('mech',P.mech);P.sub=n('sub',P.sub);P.tone=n('tone',P.tone);
  P.applied[P.vehicle]=rev;save();applyParams();bump('profile_applied');return true}
const profText=()=>{const t=tuning(P.vehicle);if(!PROF)return profErr?'Chưa tải được (kiểm tra mạng)':'Chưa tải';if(!t)return `Máy chủ bản ${PROF.rev} · chưa có hồ sơ cho xe này`;return `Hồ sơ bản ${t.rev} · đã áp dụng ${P.applied[P.vehicle]|0}`};

// ---------------- Loi C (WebAssembly) ----------------
let X=null,PRESETS=[];
const cstr=p=>{const m=new Uint8Array(X.memory.buffer);let e=p;while(m[e])e++;return new TextDecoder().decode(m.subarray(p,e))};
async function loadCore(){
  const bin=Uint8Array.from(atob(WASM_B64),c=>c.charCodeAt(0));
  const env={fmax:Math.max,fmin:Math.min,sin:Math.sin,cos:Math.cos,pow:Math.pow,exp:Math.exp,tanh:Math.tanh,atan2:Math.atan2,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,log:Math.log,log10:Math.log10,fmod:(a,b)=>a%b,sinh:Math.sinh,cosh:Math.cosh,exp2:x=>2**x,log2:Math.log2,hypot:Math.hypot};
  const {instance}=await WebAssembly.instantiate(bin,{env});X=instance.exports;X.nda_init();
  for(let i=0;i<X.nda_preset_count();i++)PRESETS.push({i,key:cstr(X.nda_preset_key(i)),name:cstr(X.nda_preset_name(i)),car:cstr(X.nda_preset_car(i)),
    cyl:X.nda_preset_info(i,0),red:X.nda_preset_info(i,1),turbo:X.nda_preset_info(i,2),intake:X.nda_preset_info(i,3),vtec:X.nda_preset_info(i,4)});
  try{const b=localStorage.getItem('nda.web.learn');if(b){const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(a.length===X.nda_learn_size())new Uint8Array(X.memory.buffer,X.nda_learn_ptr(),a.length).set(a);X.nda_learn_loaded()}}catch(e){}
  try{const c=JSON.parse(localStorage.getItem('nda.web.cal')||'null');if(c)X.nda_cal_set(c[0],c[1],c[2],c[3])}catch(e){}
  applyParams();
}
function saveLearn(){if(!X)return;try{const a=new Uint8Array(X.memory.buffer,X.nda_learn_ptr(),X.nda_learn_size());let s='';for(const b of a)s+=String.fromCharCode(b);localStorage.setItem('nda.web.learn',btoa(s));
  if(X.nda_cal(0))localStorage.setItem('nda.web.cal',JSON.stringify([X.nda_cal(1),X.nda_cal(2),X.nda_cal(3),X.nda_cal(4)]))}catch(e){}}
const presetIdx=()=>Math.max(0,PRESETS.findIndex(p=>p.key===P.preset));
function applyParams(){if(!X)return;const cap=P.t100>1?27.78/P.t100*1.4:0;let knee=50;
  if(cap>.5&&P.hp>10&&P.kg>100)knee=Math.max(25,Math.min(160,P.hp*746*.85/(P.kg*cap)*3.6));
  X.nda_set_params(presetIdx(),P.vol,P.tone,P.pops,P.shiftPop,P.autoVol,P.rearFx,P.rearAmt,P.sub,P.growl,P.crisp,cap,knee,P.interior,P.mech,P.learn,0,1);
  X.nda_set_mute(tracking||!driveMode?1:0)}
const ST=()=>new Float64Array(X.memory.buffer,X.nda_state(),24);

// ---------------- Am thanh ----------------
let ctx=null,node=null,lastAudio=0;
// iPhone: Safari tat am thanh web khi gat nut Im lang -> khai bao "phat nhac" (iOS 17+) + phat tep im lang lap lai (iOS cu)
let silentEl=null;
function silentWavURL(){const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!silentEl){silentEl=new Audio(silentWavURL());silentEl.loop=true;silentEl.setAttribute('playsinline','')}silentEl.play().catch(()=>{})}catch(e){}
  if(ctx){try{const b=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);src.start(0)}catch(e){}ctx.resume&&ctx.resume()}
}
function startAudio(){
  if(ctx){unlockAudio();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Trình duyệt không hỗ trợ âm thanh');return}
  try{ctx=new AC({latencyHint:'interactive'})}catch(e){ctx=new AC()}
  ctx.onstatechange=()=>render();
  unlockAudio();
  node=ctx.createScriptProcessor(2048,0,1);
  node.onaudioprocess=e=>{const out=e.outputBuffer.getChannelData(0);let o=0;while(o<out.length){const n=Math.min(4096,out.length-o);const p=X.nda_render(n,ctx.sampleRate);out.set(new Float32Array(X.memory.buffer,p,n),o);o+=n}lastAudio=performance.now()};
  node.connect(ctx.destination);
}
// buoc vat ly khi khong co am thanh (che do theo doi im lang)
setInterval(()=>{if(X&&performance.now()-lastAudio>400)X.nda_step(0.1)},100);

// ---------------- Cam bien ----------------
const SEN={imuN:0,gpsN:0,imuHz:0,gpsHz:0,lastImu:0,lastGps:0,gpsKmh:-1,gpsAcc:-1,heading:-1,alt:null,course:-1,prevFix:null,g:[0,0,9.8],errs:[],perm:{},caps:{}};
let sensorsOn=false,wake=null;
async function startSensors(){
  if(sensorsOn)return;sensorsOn=true;
  try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){SEN.perm.motion=await DeviceMotionEvent.requestPermission()}}catch(e){SEN.perm.motion='lỗi '+e.message}
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){SEN.perm.orient=await DeviceOrientationEvent.requestPermission()}}catch(e){}
  addEventListener('devicemotion',onMotion);
  addEventListener('deviceorientationabsolute',onOrient);addEventListener('deviceorientation',onOrient);
  if(navigator.geolocation){navigator.geolocation.watchPosition(onFix,e=>{SEN.errs.push(e.code+': '+e.message);SEN.perm.geo='lỗi '+e.code;render()},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
  else SEN.perm.geo='không hỗ trợ';
  keepAwake();
}
async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(engineOn||tracking)){keepAwake();if(ctx&&driveMode)unlockAudio()}});
// cham bat ky dau: neu am thanh bi trinh duyet tam dung thi bat lai
document.addEventListener('pointerdown',()=>{if(ctx&&ctx.state!=='running'&&driveMode)unlockAudio()},true);
let lastImuT=0;
function onMotion(e){
  if(!X)return;const t=e.timeStamp/1000;if(t-lastImuT<0.008)return;lastImuT=t;
  const ag=e.accelerationIncludingGravity,la=e.acceleration,rr=e.rotationRate;if(!ag||ag.x==null)return;
  let lin;if(la&&la.x!=null){lin=[la.x,la.y,la.z];SEN.g=[ag.x-la.x,ag.y-la.y,ag.z-la.z]}
  else{for(let i=0;i<3;i++)SEN.g[i]+=([ag.x,ag.y,ag.z][i]-SEN.g[i])*.02;lin=[ag.x-SEN.g[0],ag.y-SEN.g[1],ag.z-SEN.g[2]]}
  const d2r=Math.PI/180,r=rr&&rr.alpha!=null?[rr.beta*d2r,rr.gamma*d2r,rr.alpha*d2r]:[0,0,0];
  SEN.lin=lin;SEN.rot=r;
  // trinh duyet: trong luc huong LEN (giong Android) -> doi dau cho loi C
  X.nda_imu(lin[0],lin[1],lin[2],-SEN.g[0],-SEN.g[1],-SEN.g[2],r[0],r[1],r[2],t);
  SEN.imuN++;SEN.lastImu=performance.now();
}
function onOrient(e){if(SEN.gpsKmh>8)return;let h=null;if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;if(h!=null)SEN.heading=h}
function dist(a,b){const R=6371000,r=Math.PI/180,dl=(b.latitude-a.latitude)*r,dn=(b.longitude-a.longitude)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function onFix(p){
  const c=p.coords,now=performance.now();SEN.perm.geo='được cấp';SEN.gpsN++;SEN.lastGps=now;SEN.gpsAcc=c.accuracy;SEN.alt=c.altitude;
  SEN.caps.speed=SEN.caps.speed||c.speed!=null;SEN.caps.heading=SEN.caps.heading||c.heading!=null;SEN.caps.altitude=SEN.caps.altitude||c.altitude!=null;
  let v=c.speed;if(v!=null&&!isFinite(v))v=null;   // mot so trinh duyet gui NaN khi dung yen
  if(v==null&&SEN.prevFix&&c.accuracy<35){const dt=(p.timestamp-SEN.prevFix.t)/1000;if(dt>0.4&&dt<10)v=dist(SEN.prevFix.c,c)/dt}
  SEN.prevFix={c:{latitude:c.latitude,longitude:c.longitude},t:p.timestamp};
  if(v==null||c.accuracy>65)return;
  SEN.gpsKmh=v*3.6;SEN.course=c.heading!=null&&!isNaN(c.heading)?c.heading:-1;
  if(SEN.course>=0&&SEN.gpsKmh>8)SEN.heading=SEN.course;

  detect(SEN.gpsKmh);
}

let engineOn=false,driveMode=false,tracking=false,motionRun=false,movingSince=0,stillSince=0;
function detect(kmh){const now=performance.now();
  if(kmh>12){stillSince=0;if(!movingSince)movingSince=now}else{movingSince=0;if(kmh<4){if(!stillSince)stillSince=now}else stillSince=0}
  if(!motionRun&&movingSince&&now-movingSince>=4000){motionRun=true;bump('drive_detected');evaluate()}
  else if(motionRun&&stillSince&&now-stillSince>=180000){motionRun=false;stillSince=0;bump('drive_ended_still');evaluate()}}
let manual=false,userOff=false;
function evaluate(){
  const autoOK=tracking||(driveMode&&P.autoStart);
  const should=(tracking||driveMode)&&!userOff&&(manual||(autoOK&&motionRun));
  X&&X.nda_set_mute(tracking||!driveMode?1:0);
  if(should&&!engineOn){engineOn=true;X.nda_engine_start();startTrip();bump(tracking?'engine_start_track':'engine_start_drive')}
  else if(!should&&engineOn){engineOn=false;X.nda_engine_stop();stopTrip();bump('engine_stop')}
  render();
}
async function startDrive(){startAudio();await startSensors();tracking=false;driveMode=true;manual=true;userOff=false;applyParams();bump('mode_drive');evaluate()}
function stopDrive(){manual=false;userOff=true;evaluate()}
async function startTracking(){await startSensors();tracking=true;driveMode=false;manual=false;userOff=false;applyParams();bump('mode_tracking');evaluate();toast('Đang theo dõi: tự ghi khi xe chạy > 12 km/h')}
function stopTracking(){tracking=false;motionRun=false;evaluate()}

function fit(c,h){const dpr=devicePixelRatio||1,w=c.clientWidth;if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px'}const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return [g,w,h]}
const CS=getComputedStyle(document.documentElement),C=k=>CS.getPropertyValue(k).trim();
function dial(g,cx,cy,R,v,maxV,red,step,lab,unit,big){
  const a0=Math.PI*.75,a1=Math.PI*2.25,ang=x=>a0+(a1-a0)*Math.min(1,Math.max(0,x/maxV));
  g.lineCap='round';g.lineWidth=4;g.strokeStyle=C('--line');g.beginPath();g.arc(cx,cy,R,a0,a1);g.stroke();
  if(red){g.strokeStyle=C('--red');g.beginPath();g.arc(cx,cy,R,ang(red),a1);g.stroke()}
  if(v>.5){g.save();const k=red&&v>red*.97?C('--red'):C('--amb');g.shadowColor=k;g.shadowBlur=8;g.strokeStyle=k;g.beginPath();g.arc(cx,cy,R,a0,ang(v));g.stroke();g.restore()}
  g.font=`500 ${Math.max(8,R*.11)}px -apple-system,sans-serif`;g.textAlign='center';g.textBaseline='middle';
  for(let x=0;x<=maxV+.1;x+=step){const a=ang(x),maj=Math.abs(x/lab-Math.round(x/lab))<1e-6;g.strokeStyle=red&&x>=red?C('--red'):C('--mut');g.globalAlpha=maj?1:.5;g.lineWidth=maj?1.6:.8;g.lineCap='butt';
    g.beginPath();g.moveTo(cx+Math.cos(a)*(R-7),cy+Math.sin(a)*(R-7));g.lineTo(cx+Math.cos(a)*(R-(maj?15:11)),cy+Math.sin(a)*(R-(maj?15:11)));g.stroke();
    if(maj){g.fillStyle=C('--mut');g.fillText(String(red?x/1000:x),cx+Math.cos(a)*(R-25),cy+Math.sin(a)*(R-25))}}
  g.globalAlpha=1;const a=ang(v);g.strokeStyle=C('--fg');g.lineWidth=2;g.lineCap='round';g.beginPath();g.moveTo(cx+Math.cos(a)*R*.18,cy+Math.sin(a)*R*.18);g.lineTo(cx+Math.cos(a)*(R-5),cy+Math.sin(a)*(R-5));g.stroke();
  g.fillStyle=C('--card');g.strokeStyle=C('--line');g.beginPath();g.arc(cx,cy,6,0,7);g.fill();g.stroke();
  g.fillStyle=C('--fg');g.font=`300 ${R*.3}px ui-monospace,monospace`;g.fillText(big,cx,cy+R*.45);
  g.fillStyle=C('--mut');g.font=`600 ${Math.max(8,R*.1)}px -apple-system,sans-serif`;g.fillText(unit,cx,cy+R*.7);
}

  const R=Math.min(W*.205,H*.48),red=PRESETS[presetIdx()]?.red||7000,maxR=Math.ceil((red+1000)/1000)*1000,run=s[14]!==0,sp=s[10],rpm=s[11];

  const gear=!run?'P':(sp<1?'N':String(s[12]|0));g.fillStyle=run?C('--amb'):C('--mut');g.font=`700 ${R*.42}px -apple-system,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(gear,W/2,H*.5);

  const bw=W*.035,bh=H*.24,bx=W/2-bw/2,by=H*.5+R*.28,ld=Math.min(1,Math.max(0,s[13]));g.fillStyle=C('--line');g.fillRect(bx,by,bw,bh);g.fillStyle=ld>.85?C('--red'):C('--amb');g.fillRect(bx,by+bh*(1-ld),bw,bh*ld)}

  const sw=(k,t)=>`<div class="row"><span class="t">${t}</span><input type="checkbox" class="sw" data-k="${k}" ${P[k]?'checked':''}></div>`;
  const sl=(k,t,mn=0,mx=1,st=.01,fmt=x=>Math.round(x*100)+'%')=>`<div class="row" style="display:block"><div style="display:flex"><span class="t">${t}</span><span class="v" id="v_${k}">${fmt(P[k])}</span></div><input type="range" min="${mn}" max="${mx}" step="${st}" value="${P[k]}" data-s="${k}"></div>`;
  if(page==='sound'){const v=veh();h=`<h1>Lựa chọn âm thanh</h1><div class="card">`+PRESETS.map(p=>{const ly=['nổ','ống xả'];if(p.intake>0)ly.push('hút gió');if(p.turbo)ly.push('turbo');if(p.vtec>0)ly.push('VTEC');ly.push('lụp bụp','cơ khí','sub');
      return `<div class="row opt ${p.key===P.preset?'sel':''}" data-pre="${p.key}"><span class="t"><b>${v&&v.preset===p.key?'★ ':''}${esc(p.name)}</b><small>${esc(p.car)}<br>${p.cyl} xi-lanh · ${p.red} v/p${p.turbo?' · turbo':''}<br>Lớp: ${ly.join(' · ')}</small></span></div>`}).join('')+
    `</div><p class="foot">Mọi tiếng pô được TỔNG HỢP bằng thuật toán theo vật lý từng kiểu động cơ, không dùng bản ghi âm có bản quyền. Mỗi tiếng tách thành nhiều lớp (nổ, ống xả, hút gió, turbo, lụp bụp, cơ khí, sub) để Tự động hoá chỉnh riêng theo số liệu lái. ★ = gợi ý cho xe đang chọn.</p>`}
  else if(page==='car'){const groups={};VEH.forEach(v=>(groups[v.model]=groups[v.model]||[]).push(v));
    h=`<h1>Xe đang lái</h1><h2>Người lái thử</h2><div class="card"><input type="text" id="tester" maxlength="24" placeholder="Biệt danh (để trống = chủ xe)" value="${esc(P.tester)}"></div><p class="foot">Đặt biệt danh khi cho bạn bè chạy thử (vd: tester-01) để Claude tách số liệu theo người và xe. Không ghi tên thật.</p>`+
    Object.keys(groups).map(m=>`<h2>VinFast ${m}</h2><div class="card">`+groups[m].map(v=>`<div class="row opt ${v.id===P.vehicle?'sel':''}" data-veh="${v.id}"><span class="t"><b>${esc(v.trim)}</b><small>${v.hp} mã lực (${v.kw} kW) · ${v.nm} Nm · ${v.drive} · ${v.kg} kg · 0–100 ${v.t100} s${v.est?' (ước tính)':''}</small></span></div>`).join('')+`</div>`).join('')+
    `<p class="foot">Thông số theo công bố của VinFast; mục "ước tính" sẽ được sửa tự động qua Hồ sơ chuẩn theo xe.</p>`}
  else if(page==='tune'){h=`<h1>Tinh chỉnh âm thanh</h1><div class="card">${sl('vol','Âm lượng')}${sl('tone','Độ đanh của pô')}${sl('growl','Độ gằn (uy lực)')}${sl('crisp','Độ dòn (tiếng nổ)')}${sl('interior','Giống ngồi trong xe')}${sl('mech','Tiếng cơ khí')}${sl('sub','Rung sub gầm ghế')}${sl('rearAmt','Cảm giác phía sau')}</div>
    <div class="card" style="margin-top:12px">${sw('pops','Nổ lụp bụp khi nhả ga')}${sw('shiftPop','Tiếng "bụp" khi lên số')}${sw('autoVol','Tự tăng âm lượng theo tốc độ')}${sw('rearFx','Hiệu ứng tiếng từ phía sau')}</div>`}
  else if(page==='auto'){const s=X?ST():null;h=`<h1>Tự động hoá</h1><div class="card">${sw('learn','Tự học theo xe và cách lái')}${sw('autoProfile','Tự áp dụng hồ sơ chuẩn theo xe')}
    <div class="row"><span class="t">Hồ sơ đã học</span><span class="v">${s?`${s[19].toFixed(1)} km · lái ${s[16]<.33?'êm':s[16]<.66?'vừa':'thể thao'} · 0–100 ~${s[18].toFixed(1)} s · ${(s[17]*100).toFixed(0)}%`:''}</span></div></div>
    <p class="foot">AI chạy ngay trên máy (không gửi dữ liệu đi): học độ bốc thật của xe theo từng dải tốc độ và phong cách lái, rồi tự chỉnh độ gằn, độ dòn, điểm sang số cho khớp. Hồ sơ chuẩn theo xe là bộ tinh chỉnh Claude làm từ báo cáo các chuyến chạy thử.</p>
    <button class="btn" id="resetLearn">Học lại từ đầu</button>`}
  else if(page==='report'){h=`<h1>Báo cáo hệ thống</h1><button class="btn" id="ex1">Xuất báo cáo gọn</button><button class="btn" id="ex2">Xuất TOÀN BỘ dữ liệu</button>
    <p class="foot">Gồm thông số xe, người lái thử, kiểm tra hệ thống, khả năng trình duyệt, bộ đếm sự kiện và số liệu từng chuyến. Không chứa tọa độ, tên thật hay số điện thoại.</p>
    <h2>Trình duyệt cho phép đọc</h2><div class="card">`+caps().map(([t,ok,v])=>`<div class="row"><span class="dot" style="background:${ok?'var(--grn)':'var(--red)'}"></span><span class="t">${t}</span><span class="v">${esc(v||'')}</span></div>`).join('')+`</div>
    <h2>Đánh giá khi chạy</h2><div class="card">`+assess().map(([t,v,l])=>`<div class="row"><span class="dot" style="background:${['var(--grn)','var(--amb)','var(--red)'][l]}"></span><span class="t">${t}</span><span class="v">${esc(v)}</span></div>`).join('')+`</div>`}
  else if(page==='update'){h=`<h1>Cập nhật hệ thống</h1><div class="card"><div class="row"><span class="t">Phiên bản web</span><span class="v">${APP_VER}</span></div><div class="row"><span class="t">Hồ sơ chuẩn theo xe</span><span class="v">${esc(profText())}</span></div></div>
    <button class="btn" id="applyProf">Tải & áp dụng hồ sơ cho xe này</button><button class="btn" id="reload">Tải lại bản web mới nhất</button>
    <p class="foot">Bộ tinh chỉnh riêng cho từng dòng VinFast được Claude cập nhật từ báo cáo các chuyến chạy thử. Web tự kiểm tra mỗi lần mở.</p>`}
  else if(page==='run'){h=`<h1>Nổ máy tự động</h1><div class="card">${sw('autoStart','Tự nổ máy khi xe chạy (GPS > 12 km/h)')}</div><p class="foot">Khi bật, sau khi bấm START một lần, pô ảo tự nổ máy mỗi khi xe bắt đầu chạy và tự tắt khi xe dừng hẳn 3 phút. Trình duyệt cần để mở và màn hình sáng.</p>`}
  r.innerHTML=back+h;$('bk').onclick=()=>{page=null;renderSettings()};
  r.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{P[e.dataset.k]=e.checked?1:0;save();applyParams();if(e.dataset.k==='autoProfile'&&e.checked)applyProfile(false);evaluate()});
  r.querySelectorAll('[data-s]').forEach(e=>e.oninput=()=>{const k=e.dataset.s;P[k]=+e.value;$('v_'+k).textContent=Math.round(P[k]*100)+'%';save();applyParams()});
  r.querySelectorAll('[data-pre]').forEach(e=>e.onclick=()=>{P.preset=e.dataset.pre;save();applyParams();bump('preset_select');renderSettings()});
  r.querySelectorAll('[data-veh]').forEach(e=>e.onclick=()=>{const v=VEH.find(x=>x.id===e.dataset.veh);P.vehicle=v.id;P.hp=v.hp;P.kg=v.kg;P.t100=v.t100;save();applyParams();if(P.autoProfile)applyProfile(false);bump('vehicle_select');toast('Đã chọn VinFast '+vTitle(v));renderSettings()});
  const t=$('tester');if(t)t.oninput=()=>{P.tester=t.value.trim().slice(0,24);save()};
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on('resetLearn',()=>{if(confirm('Xoá hồ sơ đã học và học lại từ đầu?')){X.nda_learn_reset();X.nda_cal_reset();localStorage.removeItem('nda.web.learn');localStorage.removeItem('nda.web.cal');renderSettings()}});
  on('ex1',()=>exportReport(false));on('ex2',()=>exportReport(true));
  on('applyProf',async()=>{await fetchProfiles();toast(applyProfile(true)?'Đã áp dụng hồ sơ':'Chưa có hồ sơ cho xe này');renderSettings()});
  on('reload',()=>location.reload());
}

// ---------------- Xuat bao cao ----------------
async function exportReport(full){
  const trips=(await dbAll()).sort((a,b)=>a.id-b.id),pick=full?trips:trips.slice(-3),s=X?ST():null,v=veh();
  const rep={generated_at:new Date().toISOString(),app_version:APP_VER,platform:'web',user_agent:navigator.userAgent,
    xe:v?{id:v.id,ten:vTitle(v),hp:v.hp,kw:v.kw,kg:v.kg,t100:v.t100,drive:v.drive,uoc_tinh:v.est}:{id:P.vehicle,hp:P.hp,kg:P.kg,t100:P.t100},
    nguoi_lai_thu:P.tester,ho_so_may_chu:{server_rev:PROF?PROF.rev:0,applied_rev:P.applied[P.vehicle]|0,auto:P.autoProfile,status:profText()},
    settings:Object.fromEntries(Object.entries(P).filter(([k])=>!['counters','days','applied'].includes(k))),
    kha_nang_trinh_duyet:caps().map(([t,ok,v])=>({ten:t,co:ok,gia_tri:v})),danh_gia_he_thong:assess().map(([t,v,l])=>({ten:t,gia_tri:v,muc:l})),
    state_now:s?{fused_kmh:s[0],calibrated:s[2],cal_progress:s[5],mount_angle_deg:s[6],gps_delay_s:s[7],quality:s[21],gps_repeat_ratio:s[22],imu_hz:SEN.imuHz,gps_hz:SEN.gpsHz,gps_acc_m:SEN.gpsAcc}:{},
    learned:s?{sport:s[16],confidence:s[17],zero_to_100_s:s[18],distance_km:s[19],samples:s[20]}:{},
    thu_nghiem_7_ngay:{days:P.days,km:P.km,minutes:P.min,trips:P.trips},events_total:P.counters,errors:SEN.errs.slice(-20),
    chuyen_di:pick.map(t=>({tom_tat:t.sum,csv:t.csv}))};
  const blob=new Blob([JSON.stringify(rep,null,1)],{type:'application/json'}),name=`NDADrive-web-bao-cao-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'')}.json`;
  const f=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Báo cáo NDA Drive'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Đã tải tệp '+name);
}

// ---------------- Khoi dong ----------------
(async()=>{await dbOpen();try{await loadCore()}catch(e){toast('Lỗi tải lõi âm thanh: '+e.message)}render();tick();fetchProfiles();bump('web_open')})();
</script>
