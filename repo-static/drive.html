<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>NDA Drive Web</title>
<style>
:root{--bg:#09090b;--card:#141417;--line:#2a2a2f;--fg:#f2efe8;--mut:#8e8e93;--amb:#d4b26a;--red:#e5484d;--grn:#3dd68c;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:1100px;margin:0 auto;padding:12px 16px}
h1{font-size:28px;font-weight:800;margin:6px 0 12px;letter-spacing:-.5px}
h2{font-size:12px;letter-spacing:1.6px;color:var(--mut);font-weight:600;margin:18px 4px 8px;text-transform:uppercase}
.card{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px 16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1}.row .v{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.mut{color:var(--mut)}.amb{color:var(--amb)}.ok{color:var(--grn)}.bad{color:var(--red)}
.chips{display:flex;gap:8px}.chip{flex:1;text-align:center;font-size:12px;padding:5px 4px;border-radius:13px;border:.5px solid var(--line);color:var(--mut);white-space:nowrap;overflow:hidden}
.chip.on{color:var(--grn);border-color:rgba(61,214,140,.4);background:rgba(61,214,140,.08)}
canvas{display:block;width:100%}
#drive{display:grid;gap:14px}
@media(min-width:900px){#drive{grid-template-columns:1.6fr 1fr;align-items:center}#drive .side{grid-column:2;grid-row:1/4}}
.startwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.start{width:176px;height:176px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;
 background:radial-gradient(circle at 50% 50%,#000 0 60%,transparent 61%),linear-gradient(#6b6b73,#1e1e22);box-shadow:0 8px 30px rgba(0,0,0,.6);transition:transform .12s}
.start:active{transform:scale(.95)}
.start .face{position:absolute;inset:10px;border-radius:50%;border:3px solid rgba(200,200,200,.5);
 background:radial-gradient(circle at 35% 30%,#2a2a2e,#070708 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--fg);transition:all .3s}
.start.on .face{border-color:var(--amb);box-shadow:0 0 18px rgba(212,178,106,.7),inset 0 0 12px rgba(212,178,106,.25);color:var(--amb)}
.start small{font-size:11px;letter-spacing:2px;opacity:.8}.start b{font-size:20px;font-weight:900;letter-spacing:1.5px;line-height:1.15}
.start i{width:7px;height:7px;border-radius:4px;background:var(--red);box-shadow:0 0 6px var(--red);margin-top:8px}
.start.on i{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.big{width:100%;height:60px;border-radius:16px;border:0;font-size:18px;font-weight:800;cursor:pointer;background:var(--amb);color:var(--bg)}
.big.stop{background:rgba(229,72,77,.12);color:var(--red);border:1px solid var(--red)}
.btn{width:100%;height:48px;border-radius:14px;border:1px solid var(--amb);background:none;color:var(--amb);font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.menu .row{cursor:pointer}.menu .row .ic{width:28px;text-align:center;color:var(--amb);font-size:18px}
.menu .row .sub{display:block;color:var(--mut);font-size:13px}
.menu .row::after{content:"›";color:var(--mut);font-size:20px}
.back{background:none;border:0;color:var(--amb);font-size:16px;padding:6px 0;cursor:pointer}
.opt{cursor:pointer}.opt.sel{background:rgba(212,178,106,.10)}.opt.sel .t b{color:var(--amb)}
.opt .t small{display:block;color:var(--mut);font-size:13px}
input[type=range]{width:100%;accent-color:var(--amb)}
input[type=text]{width:100%;background:var(--bg);border:.5px solid var(--line);color:var(--fg);border-radius:10px;padding:10px;font-size:15px}
.sw{appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw:checked{background:var(--amb)}.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;transition:.2s}.sw:checked::after{left:22px}
.foot{color:var(--mut);font-size:13px;margin:8px 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:22px;line-height:1.1}
nav button.act{color:var(--amb)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-line}
.ring{display:flex;gap:16px;align-items:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:var(--fg);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<main>
<section id="tab0">
  <h1>Nổ máy</h1>
  <div id="drive">
    <div class="chips"><div class="chip" id="cGps">GPS</div><div class="chip" id="cSen">Cảm biến</div><div class="chip" id="cAud">Âm thanh</div></div>
    <canvas id="compass" height="36"></canvas>
    <canvas id="cluster"></canvas>
    <div class="side">
      <div class="startwrap">
        <button class="start" id="startBtn" aria-label="Engine start stop"><div class="face"><small>ENGINE</small><b>START</b><b>STOP</b><i></i></div></button>
        <div class="mut" id="modeLbl" style="text-align:center;font-size:13px"></div>
      </div>
      <div class="card" style="margin-top:12px"><div class="mut" style="font-size:11px;letter-spacing:1.6px">XE · TIẾNG PÔ</div><div id="carName" style="font-size:22px;font-weight:300"></div><div id="carSub" class="mut" style="font-size:13px"></div></div>
    </div>
  </div>
</section>

<section id="tab1" hidden>
  <h1>Theo dõi im lặng</h1>
  <button class="big" id="trackBtn"></button>
  <p class="mut" id="trackLbl" style="text-align:center;margin:8px 0"></p>
  <h2>Giả lập động cơ (không phát tiếng)</h2>
  <canvas id="cluster2"></canvas>
  <h2>Thu thập dữ liệu (7 ngày)</h2>
  <div class="card ring"><canvas id="ring" width="84" height="84" style="width:84px;flex:none"></canvas><div class="mono" id="trialLbl"></div></div>
  <h2>Chuyến đang ghi</h2>
  <div class="card mono" id="liveLbl"></div>
  <button class="btn" id="exportBtn">Xuất báo cáo cho Claude</button>
  <h2>Đánh giá hệ thống</h2>
  <div class="card" id="assess"></div>
</section>

<section id="tab2" hidden>
  <div id="setRoot"></div>
</section>
</main>
<nav>
  <button data-t="0" class="act"><span>⏻</span>Nổ máy</button>
  <button data-t="1"><span>◉</span>Theo dõi</button>
  <button data-t="2"><span>⚙︎</span>Cài đặt</button>
</nav>
<div id="toast"></div>

  g.globalAlpha=1;const a=ang(v);g.strokeStyle=C('--fg');g.lineWidth=2;g.lineCap='round';g.beginPath();g.moveTo(cx+Math.cos(a)*R*.18,cy+Math.sin(a)*R*.18);g.lineTo(cx+Math.cos(a)*(R-5),cy+Math.sin(a)*(R-5));g.stroke();
  g.fillStyle=C('--card');g.strokeStyle=C('--line');g.beginPath();g.arc(cx,cy,6,0,7);g.fill();g.stroke();
  g.fillStyle=C('--fg');g.font=`300 ${R*.3}px ui-monospace,monospace`;g.fillText(big,cx,cy+R*.45);
  g.fillStyle=C('--mut');g.font=`600 ${Math.max(8,R*.1)}px -apple-system,sans-serif`;g.fillText(unit,cx,cy+R*.7);
}
function drawCluster(c){const W=c.clientWidth,H=Math.round(W*.52);const [g]=fit(c,H);g.clearRect(0,0,W,H);if(!X)return;const s=ST();
  const R=Math.min(W*.205,H*.48),red=PRESETS[presetIdx()]?.red||7000,maxR=Math.ceil((red+1000)/1000)*1000,run=s[14]!==0,sp=s[10],rpm=s[11];
  dial(g,W*.235,H*.5,R,sp,220,0,10,40,'KM/H',sp.toFixed(0));dial(g,W*.765,H*.5,R,rpm,maxR,red,500,1000,'×1000 V/P',(rpm/1000).toFixed(1));
  const gear=!run?'P':(sp<1?'N':String(s[12]|0));g.fillStyle=run?C('--amb'):C('--mut');g.font=`700 ${R*.42}px -apple-system,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(gear,W/2,H*.5);
  g.fillStyle=C('--mut');g.font='600 9px -apple-system,sans-serif';g.fillText('SỐ',W/2,H*.5-R*.32);
  const bw=W*.035,bh=H*.24,bx=W/2-bw/2,by=H*.5+R*.28,ld=Math.min(1,Math.max(0,s[13]));g.fillStyle=C('--line');g.fillRect(bx,by,bw,bh);g.fillStyle=ld>.85?C('--red'):C('--amb');g.fillRect(bx,by+bh*(1-ld),bw,bh*ld)}
function drawCompass(){const c=$('compass'),[g,W,H]=fit(c,36);g.clearRect(0,0,W,H);g.fillStyle=C('--card');g.strokeStyle=C('--line');g.beginPath();g.roundRect?g.roundRect(.5,.5,W-1,H-1,H/2):g.rect(0,0,W,H);g.fill();g.stroke();
  g.save();g.clip();const h=SEN.heading<0?0:SEN.heading,ppd=W/120,N=['B','ĐB','Đ','ĐN','N','TN','T','TB'];g.textAlign='center';g.textBaseline='top';
  for(let d=-75;d<=75;d+=5){const deg=(h+d+720)%360,base=Math.round(deg/5)*5,x=W/2+(d+base-deg)*ppd,bi=base%360,card=bi%45===0,ten=bi%15===0;
    g.strokeStyle=C('--mut');g.globalAlpha=card?1:.5;g.lineWidth=card?1.5:.8;g.beginPath();g.moveTo(x,H-4);g.lineTo(x,H-(card?12:ten?9:6));g.stroke();g.globalAlpha=1;
    if(Math.abs(x-W/2)<26)continue;
    if(card){g.fillStyle=C('--fg');g.font='700 13px -apple-system,sans-serif';g.fillText(N[bi/45],x,3)}else if(ten){g.fillStyle=C('--mut');g.font='500 9px -apple-system,sans-serif';g.fillText(bi,x,6)}}
  g.fillStyle=C('--amb');g.beginPath();g.moveTo(W/2-6,H);g.lineTo(W/2+6,H);g.lineTo(W/2,H-8);g.fill();
  const t=SEN.heading<0?'—':N[Math.round(h/45)%8]+' '+String(Math.round(h)).padStart(3,'0')+'°';g.font='700 12px ui-monospace,monospace';g.textAlign='center';g.textBaseline='top';g.fillStyle=C('--amb');g.fillText(t,W/2,4);g.restore()}
function drawRing(){const c=$('ring'),g=c.getContext('2d'),d=P.days.length;g.clearRect(0,0,84,84);g.lineWidth=8;g.lineCap='round';g.strokeStyle=C('--line');g.beginPath();g.arc(42,42,34,0,7);g.stroke();
  g.strokeStyle=d>=7?C('--grn'):C('--amb');g.beginPath();g.arc(42,42,34,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,d/7));g.stroke();g.fillStyle=C('--fg');g.font='700 22px -apple-system,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(d+'/7',42,38);
  g.fillStyle=C('--mut');g.font='500 11px -apple-system,sans-serif';g.fillText('ngày',42,58)}

// ---------------- Giao dien ----------------

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;page=null;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('act',x===b));for(let i=0;i<3;i++)$('tab'+i).hidden=i!==tab;render()});

function tick(){
  const on=x=>x;$('cGps').textContent=SEN.lastGps&&performance.now()-SEN.lastGps<5000?`GPS ${SEN.gpsKmh>=0?SEN.gpsKmh.toFixed(0):''}`:'GPS';$('cGps').classList.toggle('on',performance.now()-SEN.lastGps<5000);

    $('liveLbl').textContent=trip&&s?`Thời gian   ${(trip.n/600).toFixed(1)} phút\nQuãng đường ${trip.dist.toFixed(2)} km\nTốc độ max  ${trip.vmax.toFixed(0)} km/h\nGPS ±${SEN.gpsAcc.toFixed(0)} m · ${SEN.gpsHz} lần/s · cảm biến ${SEN.imuHz} Hz\nSố ${s[12]|0} · ${s[11].toFixed(0)} v/p · ga ${(s[13]*100).toFixed(0)}%`:'Chưa có chuyến đang ghi';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderSettings(){const r=$('setRoot');if(r.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;
  if(!page){const v=veh(),pr=PRESETS[presetIdx()],s=X?ST():null;
    const item=(id,ic,t,sub)=>`<div class="row" data-p="${id}"><span class="ic">${ic}</span><span class="t">${t}<span class="sub">${esc(sub)}</span></span></div>`;
    r.innerHTML=`<h1>Cài đặt</h1><h2>Xe & âm thanh</h2><div class="card menu">${item('sound','♫','Lựa chọn âm thanh',pr?pr.name:'')}${item('car','🚗','Xe đang lái',v?'VinFast '+vTitle(v):'Xe khác')}${item('tune','☰','Tinh chỉnh âm thanh',`âm lượng ${Math.round(P.vol*100)}% · gằn ${Math.round(P.growl*100)}% · dòn ${Math.round(P.crisp*100)}%`)}</div>
    <h2>Thông minh</h2><div class="card menu">${item('auto','✦','Tự động hoá (AI trên máy)',P.learn&&s?`đang học · ${s[19].toFixed(0)} km · tin cậy ${(s[17]*100).toFixed(0)}%`:'tắt')}${item('report','▤','Báo cáo hệ thống','kiểm tra & xuất báo cáo')}${item('update','⟳','Cập nhật hệ thống',profText())}</div>
    <h2>Khác</h2><div class="card menu">${item('run','⚡','Nổ máy tự động',P.autoStart?'bật':'tắt')}</div><p class="foot">NDA Drive Web ${APP_VER} · dùng chung lõi âm thanh với app iPhone/Android</p>`;
    r.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{page=e.dataset.p;if(page==='update')fetchProfiles();renderSettings();scrollTo(0,0)});return}
  const back=`<button class="back" id="bk">‹ Cài đặt</button>`;let h='';
  const sw=(k,t)=>`<div class="row"><span class="t">${t}</span><input type="checkbox" class="sw" data-k="${k}" ${P[k]?'checked':''}></div>`;
  const sl=(k,t,mn=0,mx=1,st=.01,fmt=x=>Math.round(x*100)+'%')=>`<div class="row" style="display:block"><div style="display:flex"><span class="t">${t}</span><span class="v" id="v_${k}">${fmt(P[k])}</span></div><input type="range" min="${mn}" max="${mx}" step="${st}" value="${P[k]}" data-s="${k}"></div>`;
  if(page==='sound'){const v=veh();h=`<h1>Lựa chọn âm thanh</h1><div class="card">`+PRESETS.map(p=>{const ly=['nổ','ống xả'];if(p.intake>0)ly.push('hút gió');if(p.turbo)ly.push('turbo');if(p.vtec>0)ly.push('VTEC');ly.push('lụp bụp','cơ khí','sub');
      return `<div class="row opt ${p.key===P.preset?'sel':''}" data-pre="${p.key}"><span class="t"><b>${v&&v.preset===p.key?'★ ':''}${esc(p.name)}</b><small>${esc(p.car)}<br>${p.cyl} xi-lanh · ${p.red} v/p${p.turbo?' · turbo':''}<br>Lớp: ${ly.join(' · ')}</small></span></div>`}).join('')+
    `</div><p class="foot">Mọi tiếng pô được TỔNG HỢP bằng thuật toán theo vật lý từng kiểu động cơ, không dùng bản ghi âm có bản quyền. Mỗi tiếng tách thành nhiều lớp (nổ, ống xả, hút gió, turbo, lụp bụp, cơ khí, sub) để Tự động hoá chỉnh riêng theo số liệu lái. ★ = gợi ý cho xe đang chọn.</p>`}
  else if(page==='car'){const groups={};VEH.forEach(v=>(groups[v.model]=groups[v.model]||[]).push(v));
    h=`<h1>Xe đang lái</h1><h2>Người lái thử</h2><div class="card"><input type="text" id="tester" maxlength="24" placeholder="Biệt danh (để trống = chủ xe)" value="${esc(P.tester)}"></div><p class="foot">Đặt biệt danh khi cho bạn bè chạy thử (vd: tester-01) để Claude tách số liệu theo người và xe. Không ghi tên thật.</p>`+
    Object.keys(groups).map(m=>`<h2>VinFast ${m}</h2><div class="card">`+groups[m].map(v=>`<div class="row opt ${v.id===P.vehicle?'sel':''}" data-veh="${v.id}"><span class="t"><b>${esc(v.trim)}</b><small>${v.hp} mã lực (${v.kw} kW) · ${v.nm} Nm · ${v.drive} · ${v.kg} kg · 0–100 ${v.t100} s${v.est?' (ước tính)':''}</small></span></div>`).join('')+`</div>`).join('')+
    `<p class="foot">Thông số theo công bố của VinFast; mục "ước tính" sẽ được sửa tự động qua Hồ sơ chuẩn theo xe.</p>`}
  else if(page==='tune'){h=`<h1>Tinh chỉnh âm thanh</h1><div class="card">${sl('vol','Âm lượng')}${sl('tone','Độ đanh của pô')}${sl('growl','Độ gằn (uy lực)')}${sl('crisp','Độ dòn (tiếng nổ)')}${sl('interior','Giống ngồi trong xe')}${sl('mech','Tiếng cơ khí')}${sl('sub','Rung sub gầm ghế')}${sl('rearAmt','Cảm giác phía sau')}</div>
    <div class="card" style="margin-top:12px">${sw('pops','Nổ lụp bụp khi nhả ga')}${sw('shiftPop','Tiếng "bụp" khi lên số')}${sw('autoVol','Tự tăng âm lượng theo tốc độ')}${sw('rearFx','Hiệu ứng tiếng từ phía sau')}</div>`}

    <button class="btn" id="resetLearn">Học lại từ đầu</button>`}
  else if(page==='report'){h=`<h1>Báo cáo hệ thống</h1><button class="btn" id="ex1">Xuất báo cáo gọn</button><button class="btn" id="ex2">Xuất TOÀN BỘ dữ liệu</button>
    <p class="foot">Gồm thông số xe, người lái thử, kiểm tra hệ thống, khả năng trình duyệt, bộ đếm sự kiện và số liệu từng chuyến. Không chứa tọa độ, tên thật hay số điện thoại.</p>
    <h2>Trình duyệt cho phép đọc</h2><div class="card">`+caps().map(([t,ok,v])=>`<div class="row"><span class="dot" style="background:${ok?'var(--grn)':'var(--red)'}"></span><span class="t">${t}</span><span class="v">${esc(v||'')}</span></div>`).join('')+`</div>
    <h2>Đánh giá khi chạy</h2><div class="card">`+assess().map(([t,v,l])=>`<div class="row"><span class="dot" style="background:${['var(--grn)','var(--amb)','var(--red)'][l]}"></span><span class="t">${t}</span><span class="v">${esc(v)}</span></div>`).join('')+`</div>`}
  else if(page==='update'){h=`<h1>Cập nhật hệ thống</h1><div class="card"><div class="row"><span class="t">Phiên bản web</span><span class="v">${APP_VER}</span></div><div class="row"><span class="t">Hồ sơ chuẩn theo xe</span><span class="v">${esc(profText())}</span></div></div>
    <button class="btn" id="applyProf">Tải & áp dụng hồ sơ cho xe này</button><button class="btn" id="reload">Tải lại bản web mới nhất</button>
    <p class="foot">Bộ tinh chỉnh riêng cho từng dòng VinFast được Claude cập nhật từ báo cáo các chuyến chạy thử. Web tự kiểm tra mỗi lần mở.</p>`}

  r.innerHTML=back+h;$('bk').onclick=()=>{page=null;renderSettings()};
  r.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{P[e.dataset.k]=e.checked?1:0;save();applyParams();if(e.dataset.k==='autoProfile'&&e.checked)applyProfile(false);evaluate()});
  r.querySelectorAll('[data-s]').forEach(e=>e.oninput=()=>{const k=e.dataset.s;P[k]=+e.value;$('v_'+k).textContent=Math.round(P[k]*100)+'%';save();applyParams()});

  const t=$('tester');if(t)t.oninput=()=>{P.tester=t.value.trim().slice(0,24);save()};
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on('resetLearn',()=>{if(confirm('Xoá hồ sơ đã học và học lại từ đầu?')){X.nda_learn_reset();X.nda_cal_reset();localStorage.removeItem('nda.web.learn');localStorage.removeItem('nda.web.cal');renderSettings()}});

}

// ---------------- Xuat bao cao ----------------
async function exportReport(full){
  const trips=(await dbAll()).sort((a,b)=>a.id-b.id),pick=full?trips:trips.slice(-3),s=X?ST():null,v=veh();
  const rep={generated_at:new Date().toISOString(),app_version:APP_VER,platform:'web',user_agent:navigator.userAgent,
    xe:v?{id:v.id,ten:vTitle(v),hp:v.hp,kw:v.kw,kg:v.kg,t100:v.t100,drive:v.drive,uoc_tinh:v.est}:{id:P.vehicle,hp:P.hp,kg:P.kg,t100:P.t100},
    nguoi_lai_thu:P.tester,ho_so_may_chu:{server_rev:PROF?PROF.rev:0,applied_rev:P.applied[P.vehicle]|0,auto:P.autoProfile,status:profText()},
    settings:Object.fromEntries(Object.entries(P).filter(([k])=>!['counters','days','applied'].includes(k))),
    kha_nang_trinh_duyet:caps().map(([t,ok,v])=>({ten:t,co:ok,gia_tri:v})),danh_gia_he_thong:assess().map(([t,v,l])=>({ten:t,gia_tri:v,muc:l})),
    state_now:s?{fused_kmh:s[0],calibrated:s[2],cal_progress:s[5],mount_angle_deg:s[6],gps_delay_s:s[7],quality:s[21],gps_repeat_ratio:s[22],imu_hz:SEN.imuHz,gps_hz:SEN.gpsHz,gps_acc_m:SEN.gpsAcc}:{},
    learned:s?{sport:s[16],confidence:s[17],zero_to_100_s:s[18],distance_km:s[19],samples:s[20]}:{},
    thu_nghiem_7_ngay:{days:P.days,km:P.km,minutes:P.min,trips:P.trips},events_total:P.counters,errors:SEN.errs.slice(-20),
    chuyen_di:pick.map(t=>({tom_tat:t.sum,csv:t.csv}))};
  const blob=new Blob([JSON.stringify(rep,null,1)],{type:'application/json'}),name=`NDADrive-web-bao-cao-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'')}.json`;
  const f=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Báo cáo NDA Drive'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Đã tải tệp '+name);
}

(async()=>{await dbOpen();try{await loadCore()}catch(e){toast('Lỗi tải lõi âm thanh: '+e.message)}render();tick();fetchProfiles();bump('web_open')})();
