plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ndarealty.ndadrive'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ndarealty.ndadrive'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.6.0'
        externalNativeBuild { cmake { cFlags '-O2', '-ffast-math' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    // Khoa ky KHONG nam trong ma nguon: CI tao/giu trong bo nho dem rieng va truyen qua bien moi truong
    def ksFile = System.getenv('NDA_KS_FILE')
    signingConfigs {
        nda {
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv('NDA_KS_PASS')
                keyAlias 'ndadrive'
                keyPassword System.getenv('NDA_KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile != null ? signingConfigs.nda : signingConfigs.debug
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
