name: Build NDA Drive Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'app/PASynth.*', 'app/PAFusion.*', 'app/PALearn.*', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Kiem thu loi C dung chung
        run: sh test/run_tests.sh
      # Khoa ky: giu trong bo nho dem rieng cua repo (khong cong khai) de cac ban sau cai de len duoc
      - name: Lay khoa ky
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.nda-ks
          key: nda-android-keystore-v1
      - name: Tao khoa ky (chi lan dau)
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.nda-ks
          openssl rand -hex 24 > ~/.nda-ks/pass
          keytool -genkeypair -keystore ~/.nda-ks/nda.jks -alias ndadrive -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$(cat ~/.nda-ks/pass)" -keypass "$(cat ~/.nda-ks/pass)" -dname "CN=NDA Drive, O=ndarealty, C=VN"
      - name: Bien dich APK
        run: |
          export NDA_KS_FILE=$HOME/.nda-ks/nda.jks
          export NDA_KS_PASS="$(cat ~/.nda-ks/pass)"
          gradle -p android assembleRelease --stacktrace
      - name: Doi ten APK
        run: |
          V=$(grep versionName android/app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          cp android/app/build/outputs/apk/release/app-release.apk "NDADrive-android-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk NDADrive-android.apk
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with: { name: nda-drive-apk, path: 'NDADrive-android*.apk' }
      - name: Dang ban phat hanh "android-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest NDADrive-android*.apk --title "NDA Drive Android – bản mới nhất" --notes "Tải NDADrive-android.apk về Samsung A7 và cài đặt."
