name: Build NDA Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiem thu tu dong (bo tao am + bo do toc do)
        run: sh test/run_tests.sh

      - name: Cai Theos
        run: |
          brew install ldid make xz dpkg
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Bien dich goi .deb (rootless cho Dopamine)
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: nda-drive-deb
          path: packages/*.deb

      - name: Dang ban phat hanh "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest packages/*.deb --title "NDA Drive – bản mới nhất" --notes "Cài qua Sileo: thêm nguồn https://raw.githubusercontent.com/anhnhadat999/nda-drive/gh-pages/"

      - name: Tao nguon Sileo (kho APT)
        run: |
          set -e
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cp repo-static/* repo/ 2>/dev/null || true
          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -k9 Packages
          bzip2 -k9 Packages
          {
            echo "Origin: NDA Drive"
            echo "Label: NDA Drive"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: ios"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: Nguồn cài đặt và cập nhật NDA Drive (pô ảo cho xe)"
            echo "MD5Sum:"
            for f in Packages Packages.gz Packages.bz2; do echo " $(md5 -q $f) $(stat -f%z $f) $f"; done
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2; do echo " $(shasum -a 256 $f | cut -d' ' -f1) $(stat -f%z $f) $f"; done
          } > Release
          touch .nojekyll
          cat Packages

      - name: Dang len GitHub Pages (nhanh gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true
