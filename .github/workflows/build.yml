name: Build NDA Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub dang thieu may macOS -> build tren Linux bang bo cong cu iOS chinh thuc cua Theos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Kiem thu tu dong (bo tao am + bo do toc do)
        run: sh test/run_tests.sh

      - name: Cai Theos (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 xz-utils dpkg-dev libtinfo6
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$HOME/theos/toolchain/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          THEOS="$HOME/theos" "$HOME/theos/bin/install-sdk" latest
          ls "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Bien dich goi .deb (rootless cho Dopamine)
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: nda-drive-deb
          path: packages/*.deb

      - name: Dang ban phat hanh "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest packages/*.deb --title "NDA Drive – bản mới nhất" --notes "Cài qua Sileo: thêm nguồn https://raw.githubusercontent.com/anhnhadat999/nda-drive/gh-pages/"

      - name: Tao nguon Sileo (kho APT)
        run: |
          set -e
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cp repo-static/* repo/ 2>/dev/null || true
          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -k9 Packages
          bzip2 -k9 Packages
          {
            echo "Origin: NDA Drive"
            echo "Label: NDA Drive"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: ios"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: Nguồn cài đặt và cập nhật NDA Drive (pô ảo cho xe)"
            echo "MD5Sum:"
            for f in Packages Packages.gz Packages.bz2; do echo " $(md5sum $f | cut -d" " -f1) $(stat -c%s $f) $f"; done
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2; do echo " $(sha256sum $f | cut -d" " -f1) $(stat -c%s $f) $f"; done
          } > Release
          touch .nojekyll
          cat Packages

      - name: Dang len GitHub Pages (nhanh gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true
